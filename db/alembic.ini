# Alembic for the PharmAssist v2 database. The DSN is never stored here: env.py reads it from
# config.attributes["dsn"] (PgStore.migrate) or the DATABASE_URL environment variable.
# CLI use from the repository root:  PYTHONPATH=src alembic -c db/alembic.ini upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
