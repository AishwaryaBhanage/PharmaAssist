# ElasticMQ (SQS-compatible) for docker-compose: the same two queues as the AWS stack, with the same
# redrive rule (3 receives, then the dead-letter queue) and visibility (30 min, matching
# config.yaml queue.visibility_timeout_s).
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq          # the hostname the api/worker containers use; queue URLs are built from it
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  pharmassist-ingest {
    defaultVisibilityTimeout = 1800 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "pharmassist-ingest-dlq"
      maxReceiveCount = 3
    }
  }
  pharmassist-ingest-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
