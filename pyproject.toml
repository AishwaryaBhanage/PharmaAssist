[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmassist"
version = "0.1.0"
description = "Agentic assistant over VA, Medicare Part D and NY Medicaid pharmacy documents"
requires-python = ">=3.11"
# One dependency list for everything. The API image installs the base set; the worker image adds
# `ingest` (Docling, with torch from the CPU wheel index first); `rerank` is the optional cross-encoder;
# `eval` the DeepEval scorer; `dev` the test tools. Locally: uv pip install -e ".[all]".
dependencies = [
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "anthropic==1.13.0",
    "python-dotenv==1.2.4",
    "openai==3.31.0",
    "tiktoken==0.14.0",
    "langsmith==0.14.11",
    "boto3==1.43.114",
    "fastapi==0.143.3",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "psycopg[binary,pool]==3.3.6",
    "pgvector==0.5.1",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "redis==8.1.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
ingest = [
    "docling==2.140.0",
    "pharmassist[rerank]",
]
rerank = [
    "sentence-transformers==6.1.0",
]
eval = [
    "deepeval==4.3.1",
]
dev = [
    "pytest==9.1.1",
    "moto==5.2.4",
]
all = ["pharmassist[ingest,rerank,eval,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a reachable PostgreSQL and/or the docker services (Valkey, ElasticMQ); skipped when unreachable"]
